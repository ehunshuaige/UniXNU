# iOS 16.7.16 (20H392) — iPhone X (iPhone10,3 / d22ap), Darwin 22.
#
# This is the OS profile for the ruyi port. It targets the *iOS 16 userland of
# the iPhone X*, not iPadOS: the display driver presents a phone-class panel and
# the device identity is the A11 / D22AP.
#
# Provenance of every field here is one of:
#   - the 20H392 IPSW itself (BuildManifest.plist identity, and the
#     __PRELINK_INFO of the extracted kernelcache for the root list);
#   - the apple-oss-distributions/xnu tag that the IPSW's kernel was built from;
#   - a value measured on the ruyi device (notes/EVIDENCE.md).
# See notes/ipsw/IPSW-FACTS.md for the member pins and identity dump.

["os"]
"name" = "ios-16.7.16-20H392"
# The arm64 slice of kernelcache.release.iphone10b in the 20H392 IPSW reports
#   Darwin Kernel Version 22.6.0: Tue Jul  2 20:47:35 PDT 2024;
#   root:xnu-8796.142.1.703.8~1/RELEASE_ARM64_T8015
# 8796.142.1 is NOT a published open-source drop: the published 8796 tags are
# 8796.101.5, 8796.121.2 and 8796.141.3. The value below is therefore the
# closest published source baseline, not the image's own build number, and the
# kernel this profile builds is not byte-identical to Apple's. Recorded here so
# nobody later mistakes the built kernel for the shipped one.
"darwin" = "22.6.0"
"xnu_version" = "8796.141.3"
# apple-oss-distributions/xnu tag xnu-8796.141.3 resolves to this commit.
# It is the same revision lonzzi/UniXNU-houji (the working SM8650 iOS 16 port)
# pins, so the two independent iOS-16 SM8650 efforts agree on the source.
"xnu_revision" = "1b191cb58250d0705d8a51287127505aa4bc0789"
# xnu-8796 still carries iokit/DriverKit headers under the 8796 tag itself; the
# split tags used by the iPadOS 17 profile do not exist for Darwin 22.
"driverkit_tag" = "xnu-8796.141.3"
"trustcache_tag" = "xnu-8796.141.3"
# The userland ABI this kernel must present. Versions read out of this
# kernelcache's __PRELINK_INFO, not from another OS profile: the iPadOS 17
# profile's IOHIDFamily-2031.120.4 does NOT apply here. No code in the current
# UniXNU snapshot consumes [os] abi; it is documentation.
"abi" = ["IOGPUFamily", "IOHIDFamily-1915.140.3", "IOMobileGraphicsFamily"]

["ipsw"]
"url" = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
"product" = "iPhone10,3"
"version" = "16.7.16"
"build" = "20H392"
"device_class" = "d22ap"
# ApChipID / ApBoardID of the d22ap Erase build identity in BuildManifest.plist.
"chip_id" = 32789
"board_id" = 6
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# Member pins, computed from the local archive (notes/ipsw/hash_all.log) and
# identical to the pins lonzzi/UniXNU-houji publishes for the same build.
["ipsw"."sha256"]
"kernelcache.release.iphone10b" = "2d6a13d040aaf87cec09bb6906d43e9bd8cea951e43d1aa1cd62707dfdc5aaec"
"DeviceTree.d22ap.im4p" = "480e8b0888949b4128b7aa2cd254497581c69e1bafa596a760b2fa955a8a6368"
"087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"
"087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"
"087-86698-044.dmg" = "80f426d5b8fca8552f95be427434f1911dbb4c2c6d28aad94f2426ddd0c92483"
"087-86593-047.dmg" = "9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849"
"087-86715-047.dmg" = "391f2df322c3172b021b2874f6da5c3e78b70b3df8f502e1a4af2b1d715c4608"

["kernel"]

["kernel"."prelink"]
"tool" = "kits/XnuPrelink/emit_prelink.py"
# Darwin 22 / iOS 16 builds the arm64 kernel in the SWEET configuration; the
# object directory keeps xnu's own name for it.
"kernel" = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# sha256 of the decompressed arm64 slice of kernelcache.release.iphone10b.
"kernelcache_sha256" = "2ec297bac95bcba01046fd0148e97e7e588c05a6c18827f39f534ba375c1221"
"slide" = "-0x1000000"
# No early_security_init: AMFI's early initializer needs an ApplePMGRNub
# provider, which no SM8650 port builds. Deferring AMFI to normal kext loading
# is what the verified ruyi bring-up did.
#
# The roots are the kexts the prelink keeps from the original kernelcache. Every
# identifier below was checked to exist in the __PRELINK_INFO of this exact
# 20H392 kernelcache (31/31 found); see notes/ipsw/PRELINK-ROOTS.md.
"roots" = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

["payload"]

# The 20H392 kernelcache text carries a few fixups the iPadOS 17 profile needs.
# This profile carries none: the ruyi bring-up does not patch signed shared-cache
# text, so there is nothing to declare.

["adt"]

["adt"."root"]

["adt"."root"."string"]
# iPhone X identity. The board name comes first: MobileGestalt reads the first
# compatible entry as the hardware model, and the iPhone X userland's UI
# (gesture navigation, no Home button) keys off the D22 identity.
"model" = "iPhone10,3"
"target-type" = "D22"
"compatible" = "D22AP"

["adt"."chosen"]

["adt"."chosen"."string"]
"osenvironment" = "main"
# libimg4 (cryptexd) needs a hash method; real A11+ device trees say sha2-384.
"crypto-hash-method" = "sha2-384"

# Security status of a dev-fused, undemoted board (tuple 0,0,1,1). MobileGestalt
# reads these from /chosen; mobileactivationd's DeviceType then takes its native
# Hactivation branch (Activated without an activation record, no SEP, no baseband).
["adt"."chosen"."u32"]
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1

["adt"."product"]

["adt"."product"."string"]
"product-name" = "iPhone X"
"product-description" = "iPhone X"
# iPhone idiom: the SpringBoard layout, the gesture bar and the app grid all
# select on this value.
"artwork-device-idiom" = "phone"
"artwork-display-gamut" = "P3"
"compatible-device-fallback" = "iPhone9,2"

# MGGetProductType() looks this 20-byte id up in libMobileGestalt's product
# table; without it every client that switches on the product type sees an
# unknown device. Taken from the real D22AP device tree in this IPSW.
["adt"."product"."bytes"]
"product-id" = "fd079b298144a7deb4d7c87fef3eb474d8f0e7eb"

["adt"."product"."u32"]
"artwork-device-subtype" = 2436
"artwork-scale-factor" = 3

# The button set and the home-button type drive the gesture UI: the iPhone X has
# no Home button, so SpringBoard takes the home-indicator path. Values read from
# the real D22AP device tree in this IPSW.
["adt"."buttons"]

["adt"."buttons"."string"]
"compatible" = "buttons"
"device_type" = "buttons"

["adt"."buttons"."strings"]
"button-names" = ["volup", "voldown", "hold", "ringerab"]

["adt"."buttons"."u32"]
"home-button-type" = 2
"button-priority_hold" = 1
"button-priority_volup" = 2
"button-priority_voldown" = 2
"opposed-power-vol-buttons" = 1

["adt"."defaults"]

["adt"."defaults"."u32"]
"kern.maxvnodes" = 10000
